services:
  # FastAPI Python Backend
  - type: web
    name: sahisupply-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: sahisupply_db
      - key: PYTHON_VERSION
        value: 3.13.0

  # React Frontend Static Site
  - type: web
    name: sahisupply-frontend
    env: static
    buildCommand: cd frontend && npm install --legacy-peer-deps && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://sahisupply-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
