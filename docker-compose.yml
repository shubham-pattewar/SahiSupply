version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: sahisupply-mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=sahisupply_db
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sahisupply-backend
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB_NAME=sahisupply_db
      - PORT=8000
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sahisupply-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  mongo_data:
